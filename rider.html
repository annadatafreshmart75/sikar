<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F4D2B">
<title>Delivery Partner — Annadata Fresh Mart</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css?v=3">
<style>
body{background:var(--cream);padding-bottom:40px}
.rtop{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:12px}
.rtop img{height:34px;background:var(--cream);border-radius:8px;padding:3px}
.rtop b{display:block;font-size:16px;white-space:nowrap}.rtop small{color:#CFE0C5;font-size:13px}
.rtop .sp{margin-left:auto;display:flex;gap:8px}
.rtop button{color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.rw{max-width:560px;margin:0 auto;padding:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--ink-2)}
.sum b{display:block;font:600 22px Fraunces,serif;color:var(--forest)}
.rc{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px -14px rgba(31,77,43,.4)}
.rc.newo{border:2px solid var(--gold);animation:pop .5s var(--ease)}
.rc .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc .h b{font-size:18px}
.slot{display:inline-flex;align-items:center;gap:6px;background:var(--forest);color:#fff;border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px;margin:8px 0}
.addr{background:var(--sand);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15.5px;line-height:1.4}
.addr small{display:block;color:var(--ink-2);font-size:13.5px;margin-top:2px}
.its{font-size:15px;margin:6px 0 2px;padding-left:18px}
.money{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:10px 12px;border-radius:12px;font-weight:700}
.money.cod{background:#FBE9DF;color:#8A3A16}.money.ok{background:var(--leaf-soft);color:var(--forest)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.acts .btn{min-height:50px;font-size:15.5px;padding:0 12px}
.acts .wide{grid-column:1/-1}
.tabs2{display:flex;gap:6px;background:var(--sand);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs2 button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.tabs2 button[aria-selected=true]{background:var(--paper);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.center{text-align:center;padding:40px 10px;color:var(--ink-2)}
.card2{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:24px}
.card2 h1{font-size:26px;margin-bottom:6px}
.confirm{position:fixed;inset:0;z-index:60;background:rgba(15,25,17,.55);display:none;align-items:flex-end;justify-content:center}
.confirm.open{display:flex}
.confirm .in{background:var(--paper);width:min(520px,100%);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.confirm h3{font-size:22px;margin-bottom:6px}
.chk{display:flex;gap:12px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:14px;margin:12px 0;font-weight:700;font-size:16px}
.chk input{width:24px;height:24px;accent-color:var(--forest)}
</style>
</head>
<body>
<div class="rtop"><img src="assets/logo-h.png" alt="Annadata"><div><b>Delivery Partner</b><small id="who">Annadata Fresh Mart</small></div><div class="sp" id="topBtns"></div></div>
<main class="rw" id="app"><p class="center">Loading…</p></main>
<div class="confirm" id="confirm"><div class="in" id="confirmIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/supabase.js"></script>
<script src="config.js?v=3"></script>
<script>
(() => {
const C = window.CONFIG;
const sb = supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce", storageKey: "af-auth" } });
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => "₹" + Number(n || 0).toLocaleString("en-IN");
const tm = s => s ? new Date(s).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }) : "";
const toast = m => { const el = $("#toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600); };
let orders = [], tab = "open", known = null, timer = null, email = "";

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  $("#who").textContent = session.user.email;
  $("#topBtns").innerHTML = `<button type="button" id="alertBtn">🔔 Alert</button><button type="button" id="outBtn">Logout</button>`;
  const { data: ok } = await sb.rpc("is_rider");
  if (!ok) { app.innerHTML = `<div class="card2"><h1>Aap list mein nahi ho</h1><p class="sub">${esc(session.user.email)} delivery partner list mein nahi hai. Annadata office se bolo ki admin panel mein aapka email jod dein.</p></div>`; return; }
  await load(); clearInterval(timer); timer = setInterval(load, 30000);
}
function loginView(step) {
  app.innerHTML = step === "code"
    ? `<div class="card2"><h1>Code daalo</h1><p class="sub">${esc(email)} par code bheja hai.</p><div class="f"><input id="code" class="otp" inputmode="numeric" maxlength="8"></div><button class="btn btn-p btn-block" id="verify">Login</button><p class="msg err" id="msg"></p></div>`
    : `<div class="card2"><h1>Delivery partner login</h1><p class="sub">Annadata ne jo email diya hai usi se login karo.</p><button class="gbtn" id="g">Continue with Google</button><div class="or">ya email code</div><div class="f"><input id="em" type="email" placeholder="aapka email" value="${esc(email)}"></div><button class="btn btn-p btn-block" id="send">Code bhejo</button><p class="msg err" id="msg"></p></div>`;
}
async function load() {
  const { data, error } = await sb.rpc("rider_orders");
  if (error) { if (!orders.length) app.innerHTML = `<p class="center">Load nahi hua. Internet check karo. <button class="linkbtn" id="retry">Dobara</button></p>`; return; }
  const ids = new Set(data.filter(o => !["delivered", "cancelled"].includes(o.status)).map(o => o.id));
  if (known) { const fresh = [...ids].filter(i => !known.has(i)); if (fresh.length) alertNew(fresh); }
  known = ids; orders = data; render();
}
function alertNew(ids) {
  toast(`Naya order aaya: #${ids.join(", #")}`);
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .35].forEach(d => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.25, a.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d + .3); o.start(a.currentTime + d); o.stop(a.currentTime + d + .3); }); } catch {}
  try { if (Notification.permission === "granted") new Notification("Annadata: naya order", { body: `Order #${ids.join(", #")} aapko diya gaya hai`, icon: "assets/icon-192.png" }); } catch {}
  ids.forEach(i => setTimeout(() => document.querySelector(`[data-o="${i}"]`)?.classList.add("newo"), 50));
}
function render() {
  const open = orders.filter(o => !["delivered", "cancelled"].includes(o.status)), done = orders.filter(o => ["delivered", "cancelled"].includes(o.status));
  const cash = done.filter(o => o.status === "delivered" && o.pay_method === "cod").reduce((a, o) => a + o.total, 0);
  const list = tab === "open" ? open : done;
  app.innerHTML = `<div class="sum"><div><b>${open.length}</b>Baaki</div><div><b>${done.filter(o => o.status === "delivered").length}</b>Deliver kiye</div><div><b>${fmt(cash)}</b>Cash (aaj)</div></div>
  <div class="tabs2"><button type="button" data-tab="open" aria-selected="${tab === "open"}">Deliver karne hain (${open.length})</button><button type="button" data-tab="done" aria-selected="${tab === "done"}">Ho gaye (${done.length})</button></div>` +
  (list.length ? list.map(card).join("") : `<p class="center">${tab === "open" ? "Abhi koi order nahi. Naya order aate hi yahan dikhega aur awaaz aayegi." : "Aaj abhi koi delivery nahi hui."}</p>`) +
  `<p class="msg">Har 30 second mein apne aap refresh hota hai · <button class="linkbtn" id="retry">Abhi refresh</button></p>`;
}
function card(o) {
  const closed = ["delivered", "cancelled"].includes(o.status);
  const cod = o.pay_method === "cod" && !o.paid;
  const map = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((o.address || "") + " " + (o.landmark || "") + " Sikar Rajasthan")}`;
  return `<article class="rc" data-o="${o.id}"><div class="h"><b>#${o.id} · ${esc(o.name)}</b><span class="chip ${o.status === "delivered" ? "ok" : o.status === "cancelled" ? "no" : "wait"}">${{ placed: "Naya", confirmed: "Ready", out_for_delivery: "Raste mein", delivered: "Delivered " + tm(o.status_times?.delivered), cancelled: "Cancelled", awaiting_payment: "Payment baaki" }[o.status] || o.status}</span></div>
    <span class="slot">🕒 ${esc(o.slot)}</span>
    <ul class="its">${(o.items || []).map(i => `<li>${esc(i.name)} ${i.opt ? "(" + esc(i.opt) + ")" : ""} × ${i.qty}</li>`).join("")}${o.has_kit ? "<li>🎁 Zucchini recipe card saath dena</li>" : ""}</ul>
    ${closed ? "" : `<div class="addr">📍 ${esc(o.address)}${o.landmark ? `<small>Landmark: ${esc(o.landmark)}</small>` : ""}</div>`}
    <div class="money ${cod ? "cod" : "ok"}"><span>${cod ? "Customer se lena hai" : "Payment ho chuka"}</span><span>${cod ? fmt(o.total) : "✓ " + fmt(o.total)}</span></div>
    ${closed ? "" : `<div class="acts"><a class="btn btn-w" href="${map}" target="_blank" rel="noopener">🗺️ Map kholo</a><a class="btn btn-w" href="tel:+91${esc(o.phone)}">📞 Call karo</a>
      ${o.status === "out_for_delivery" ? `<button class="btn btn-p wide" type="button" data-deliver="${o.id}">✅ Deliver ho gaya</button>` : `<button class="btn btn-g wide" type="button" data-go="${o.id}">🛵 Nikal gaya (raste mein)</button>`}</div>`}
  </article>`;
}
function askDeliver(id) {
  const o = orders.find(x => x.id === id); const cod = o.pay_method === "cod" && !o.paid;
  $("#confirmIn").innerHTML = `<h3>Order #${o.id} deliver ho gaya?</h3><p class="sub">${esc(o.name)} ko saara saamaan de diya?</p>
    ${cod ? `<label class="chk"><input type="checkbox" id="cash"> ${fmt(o.total)} cash / UPI le liya</label>` : ""}
    <div class="acts"><button class="btn btn-w" type="button" id="cNo">Nahi, wapas</button><button class="btn btn-p" type="button" id="cYes" data-id="${o.id}">Haan, deliver ho gaya</button></div>`;
  $("#confirm").classList.add("open");
}
async function setStatus(id, status, cash) {
  const { error } = await sb.rpc("rider_set_status", { p_id: id, p_status: status, p_cash: !!cash });
  if (error) return toast(/CLOSED/.test(error.message) ? "Ye order band ho chuka hai" : "Nahi hua, dobara try karo");
  toast(status === "delivered" ? "Badhiya! Delivered ✓" : "Customer ko dikh raha hai: raste mein");
  load();
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button,a"); if (!t) { if (e.target.id === "confirm") $("#confirm").classList.remove("open"); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
  if (t.dataset.go) return setStatus(+t.dataset.go, "out_for_delivery");
  if (t.dataset.deliver) return askDeliver(+t.dataset.deliver);
  switch (t.id) {
    case "cNo": return $("#confirm").classList.remove("open");
    case "cYes": $("#confirm").classList.remove("open"); return setStatus(+t.dataset.id, "delivered", $("#cash")?.checked ?? true);
    case "retry": return load();
    case "alertBtn": try { const p = await Notification.requestPermission(); toast(p === "granted" ? "Alert on ho gaya 🔔" : "Phone settings mein notification allow karo"); } catch { toast("Is phone par notification nahi chalta, awaaz aayegi"); } return;
    case "outBtn": await sb.auth.signOut({ scope: "local" }); location.reload(); return;
    case "g": return sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href.split("?")[0].split("#")[0], queryParams: { prompt: "select_account" } } });
    case "send": { email = $("#em").value.trim().toLowerCase(); const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.href.split("?")[0] } }); if (error) $("#msg").textContent = "Code nahi gaya. Google se login karo."; else loginView("code"); return; }
    case "verify": { const { error } = await sb.auth.verifyOtp({ email, token: $("#code").value.trim(), type: "email" }); if (error) $("#msg").textContent = "Galat code"; else start(); return; }
  }
});
sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_IN") setTimeout(start, 0); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && known) load(); });
start();
})();
</script>
</body>
</html>
